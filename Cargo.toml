[package]
name = "dtm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bincode = "1.3"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
libc = "0.2.191"
nix = { version = "0.31.3", features = ["term", "process", "signal", "ioctl", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
