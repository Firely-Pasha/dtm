# dtm configuration. Copy to ~/.config/dtm/config.toml (or set $DTM_CONFIG).
# Every setting is optional; what is shown here are the defaults.
# Apply changes to a running server with `dtm reload` or <prefix> r.

[options]
prefix = "C-a"          # key that starts a command (C-a, C-b, M-x, F1, ...)
# Program started in every new pane. Default: $SHELL, falling back to /bin/sh.
# Use the full path of a shell that exists on your machine, e.g. "/bin/zsh" or
# "/usr/bin/fish". Panes that are already open keep their shell.
# shell = "/bin/bash"
history_limit = 10000   # scrollback lines kept per pane
mouse = true            # sidebar clicks, pane focus, wheel scrolling
                        # (hold Shift to select text with the terminal itself)
clipboard = true        # copy-mode yanks also go to the terminal clipboard (OSC 52)
# Programs (besides vim, nvim, view, fzf, ...) that get Ctrl-h/j/k/l themselves instead of
# dtm moving pane focus. See "Navigating with Ctrl-h/j/k/l" in the README.
navigator_apps = []
repeat_time = 1000      # ms after a resize during which plain h/j/k/l (see [keys.resize])
                        # keep resizing, so you don't need the prefix every time; 0 = off

[sidebar]
position = "left"       # left | right
width = 24              # columns, including the separator line
visible = true
default_mode = "windows"  # windows | sessions
follow = true           # moving the selection in the focused sidebar shows that
                        # window/session immediately (false: only on Enter)

# Keys pressed after the prefix. A value of "none" removes a default binding.
[keys.prefix]
"c" = "new-window"
"&" = "kill-window"
"n" = "next-window"
"p" = "prev-window"
"1" = "select-window 1"       # ... "9" = "select-window 9"
"," = "rename-window"
"|" = "split-vertical"        # panes side by side
"-" = "split-horizontal"      # panes stacked
"Left" = "focus-left"         # move focus (also Ctrl-h/j/k/l, see [keys.root])
"Down" = "focus-down"
"Up" = "focus-up"
"Right" = "focus-right"
"h" = "resize-left 5"         # resize; then plain h/j/k/l keep resizing (see [keys.resize])
"j" = "resize-down 5"
"k" = "resize-up 5"
"l" = "resize-right 5"
"o" = "focus-next"
"H" = "resize-left 5"
"J" = "resize-down 5"
"K" = "resize-up 5"
"L" = "resize-right 5"
"z" = "zoom-pane"
"x" = "kill-pane"
"S" = "new-session"
"$" = "rename-session"
"(" = "prev-session"
")" = "next-session"
"b" = "toggle-sidebar"
"s" = "toggle-sidebar-mode"     # windows list <-> sessions list
"[" = "copy-mode"
"PageUp" = "copy-mode"
"]" = "paste-buffer"
";" = "focus-last"            # the previously focused pane
"C-l" = "send-key"            # sends a real Ctrl-l (clear screen) to the pane
"w" = "focus-sidebar"         # also: focus-left from the leftmost pane reaches a left sidebar
"d" = "detach"
"a" = "send-prefix"           # <prefix> a sends a literal prefix key
"r" = "reload-config"
"R" = "respawn-pane"          # restart the pane the way it started (asks y/n)
"M-r" = "respawn-window"      # restart the window from its project layout (asks y/n)
# "E" = "export-project"      # write the session to its project file (see `dtm export`)

# Keys that work without the prefix.
[keys.root]
# navigate-* moves between panes and on into the sidebar; when an editor such
# as Neovim is in the foreground it gets the key instead (see "Neovim plugin" in the README).
"C-h" = "navigate-left"
"C-j" = "navigate-down"
"C-k" = "navigate-up"
"C-l" = "navigate-right"
# "C-\\" = "navigate-last"   # previous pane (not bound by default: it is SIGQUIT)
# "M-n" = "next-window"
# "M-p" = "prev-window"
# "M-1" = "select-window 1"

# Keys accepted without the prefix for `repeat_time` after a resize.
[keys.resize]
"h" = "resize-left 1"
"j" = "resize-down 1"
"k" = "resize-up 1"
"l" = "resize-right 1"

# Keys while the sidebar has focus (<prefix> w, or focus towards it).
# Moving back towards the panes (l/Right for a left sidebar, h/Left for a
# right one) leaves it.
[keys.sidebar]
"j" = "sidebar-down"
"k" = "sidebar-up"
"Enter" = "sidebar-open"      # switch to the selected window/session
"x" = "sidebar-kill"          # asks y/n
"r" = "sidebar-rename"
"J" = "sidebar-move-down"     # reorder windows / sessions
"K" = "sidebar-move-up"
"n" = "sidebar-new"
"R" = "sidebar-respawn"      # asks y/n
"Tab" = "toggle-sidebar-mode"
"q" = "sidebar-leave"

# Keys while in copy mode.
[keys.copy]
"k" = "copy-up"
"j" = "copy-down"
"h" = "copy-left"
"l" = "copy-right"
"PageUp" = "copy-page-up"
"PageDown" = "copy-page-down"
"C-u" = "copy-half-page-up"
"C-d" = "copy-half-page-down"
"g" = "copy-top"
"G" = "copy-bottom"
"0" = "copy-line-start"
"$" = "copy-line-end"
"v" = "copy-select"           # start/clear selection
"V" = "copy-select-line"      # select whole lines
"y" = "copy-yank"             # copy selection (or current line) and leave
"q" = "copy-cancel"
"Escape" = "copy-cancel"
